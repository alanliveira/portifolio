name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, typecheck, testes e build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .tool-versions
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Lint (ESLint)
        run: npm run lint

      - name: Typecheck (TypeScript)
        run: npm run typecheck

      - name: Testes (Vitest)
        run: npm test

      - name: Build (Next.js)
        run: npm run build

      - name: Verificar TODOs no HTML gerado
        run: |
          if grep -rIl "TODO" .next/server/app --include=*.html; then
            echo "::error::Há textos TODO nas páginas geradas."
            exit 1
          fi

  dependencies:
    name: Auditoria de dependências
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .tool-versions
          cache: npm

      - name: Instalar dependências
        run: npm ci --ignore-scripts

      - name: npm audit (falha em vulnerabilidades altas ou críticas)
        run: npm audit --audit-level=high

      - name: Verificar assinaturas e procedência dos pacotes
        run: npm audit signatures
